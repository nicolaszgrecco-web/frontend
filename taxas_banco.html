
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Infinity Bank</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0d1117; color: #fff; display: flex; justify-content: center; padding: 40px 16px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 32px; width: 100%; max-width: 460px; }
  h1 { font-size: 1.3rem; color: #58a6ff; margin-bottom: 6px; }
  p.sub { font-size: 0.82rem; color: #8b949e; margin-bottom: 24px; }
  label { display: block; font-size: 0.85rem; color: #c9d1d9; margin-bottom: 4px; margin-top: 16px; }
  select, input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: #fff; font-size: 0.95rem; }
  button { margin-top: 24px; width: 100%; padding: 12px; background: #58a6ff; color: #0d1117; font-weight: bold; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; }
  button:hover { background: #79c0ff; }
  .resultado { margin-top: 24px; border-top: 1px solid #30363d; padding-top: 20px; display: none; }
  .resultado h2 { font-size: 1rem; color: #58a6ff; margin-bottom: 14px; }
  .linha { display: flex; justify-content: space-between; font-size: 0.9rem; padding: 7px 0; border-bottom: 1px solid #21262d; color: #c9d1d9; }
  .linha span:last-child { color: #fff; font-weight: bold; }
  .destaque { background: #1f3a5f; border-radius: 8px; padding: 12px 14px; margin-top: 14px; text-align: center; }
  .destaque small { font-size: 0.78rem; color: #8b949e; }
  .destaque strong { display: block; font-size: 1.5rem; color: #58a6ff; }
</style>
</head>
<body>
<div class="card">
  <h1>💳 Infinity Bank</h1>
  <p class="sub">Simulador de Vendas Parceladas</p>

  <label>Bandeira do Cartão</label>
  <select id="bandeira">
    <option value="visa">Visa (2%)</option>
    <option value="master">Mastercard (1,85%)</option>
    <option value="elo">Elo (3%)</option>
  </select>

  <label>Valor da Venda (R$)</label>
  <input type="number" id="valor" placeholder="Ex: 500.00" min="0" step="0.01">

  <label>Número de Parcelas</label>
  <select id="parcelas">
    <option value="1">1x</option>
    <option value="2">2x</option>
    <option value="3">3x</option>
    <option value="4">4x</option>
    <option value="6">6x</option>
    <option value="9">9x</option>
    <option value="12">12x</option>
  </select>

  <button onclick="calcular()">Simular</button>

  <div class="resultado" id="resultado">
    <h2>📊 Resumo da Transação</h2>
    <div class="linha"><span>Valor da Venda</span><span id="r-venda"></span></div>
    <div class="linha"><span>Taxa da Bandeira</span><span id="r-taxa"></span></div>
    <div class="linha"><span>Juros (0,35% a.m.)</span><span id="r-juros"></span></div>
    <div class="linha"><span>Taxa Mensal (R$ 12,50/mês)</span><span id="r-mensal"></span></div>
    <div class="linha"><span>Valor Total</span><span id="r-total"></span></div>
    <div class="destaque">
      <small>Valor de cada parcela</small>
      <strong id="r-parcela"></strong>
    </div>
  </div>
</div>

<script>
  function fmt(v) {
    return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function calcular() {
    const venda = parseFloat(document.getElementById('valor').value);
    const parcelas = parseInt(document.getElementById('parcelas').value);
    const bandeira = document.getElementById('bandeira').value;

    if (!venda || venda <= 0) { alert('Informe um valor válido!'); return; }

    let taxaPerc;
    switch (bandeira) {
      case 'visa':   taxaPerc = 0.02;   break;
      case 'master': taxaPerc = 0.0185; break;
      case 'elo':    taxaPerc = 0.03;   break;
    }

    const valorTaxa    = venda * taxaPerc;
    const juros        = venda * (0.0035 * parcelas);
    const taxaMensal   = 12.50 * parcelas;
    const total        = venda + valorTaxa + juros + taxaMensal;
    const valorParcela = total / parcelas;

    document.getElementById('r-venda').textContent   = fmt(venda);
    document.getElementById('r-taxa').textContent    = fmt(valorTaxa);
    document.getElementById('r-juros').textContent   = fmt(juros);
    document.getElementById('r-mensal').textContent  = fmt(taxaMensal);
    document.getElementById('r-total').textContent   = fmt(total);
    document.getElementById('r-parcela').textContent = `${parcelas}x de ${fmt(valorParcela)}`;

    document.getElementById('resultado').style.display = 'block';
  }
</script>
</div>
</body>
</html>
